name: ingest-nightly
# The last three NHL game dates into the lake and Supabase (docs/data-sources.md, issue #4): the
# schedule, play-by-play, boxscores, shift charts, rosters and new players' landing pages, every
# raw response mirrored to R2. The lookback picks up a game that was not final yet and a missed
# night; responses already in R2 are reused, not fetched again. The Supabase read at the end of
# every run keeps the free project from pausing in the off-season. Older gaps are caught up with
# a manual run over a date range. The Cloudflare Worker in infra/timer dispatches it at 09:00 UTC
# (#50); the cron line is the fallback while the timer is off.
on:
  schedule:
    - cron: "0 9 * * *"  # 04:00 or 05:00 ET, after every game of the night is final
  workflow_dispatch:
    inputs:
      start:
        description: First game date (YYYY-MM-DD); empty for yesterday
        required: false
        default: ""
      end:
        description: Last game date (YYYY-MM-DD); empty for the start date
        required: false
        default: ""
concurrency: ingest
permissions:
  contents: read
jobs:
  ingest:
    # GitHub's schedule is the fallback: once the Cloudflare timer in infra/timer runs (#50), the
    # repository variable TIMER_ACTIVE is true and only its on-time dispatches start this job.
    if: github.event_name != 'schedule' || vars.TIMER_ACTIVE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The live Kalshi key is the kalshi-live environment's secret, which the owner restricts to
    # main (#294): a workflow pushed on any other branch can't read it.
    environment: kalshi-live
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --frozen
      - name: Ingest
        id: ingest
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          if [ -n "$START" ]; then window=(--start "$START" --end "${END:-$START}"); else window=(--recent 3); fi
          uv run nhl ingest "${window[@]}" --r2 --supabase
      - name: Recheck last week's feeds
        # Each final game's play-by-play, boxscore and shift chart fetched again a week after the
        # copy the tables read, and stored apart where no table reads them, to measure post-game
        # corrections (#30, ADR 0004). Three dates, so two missed nights are caught up.
        if: always()
        run: uv run nhl recheck --recent 3 --r2
      - name: Odds history into the lake
        # The last 14 days of stored odds snapshots, each event matched to its NHL game (issue
        # #20). Events are priced up to about ten days ahead and a schedule response lists seven
        # days, so a snapshot is replayed until the schedules cached since list all its games.
        # Each started game's closing proxy is marked, and the flag upserted to Supabase (#21).
        id: odds
        if: always()
        run: uv run nhl odds replay --recent 14 --r2 --supabase
      - name: Settle the paper bets
        # Each paper bet whose game is final: its result on the full game, its profit, and its
        # CLV against Pinnacle's closing proxy, in the odds the replay above has just updated (#165).
        id: settle
        if: always()
        run: uv run nhl live settle --r2
      - name: Paper ledger to Supabase
        # The day's settlements onto the dashboard's paper bets (#167), once the owner has applied
        # the paper ledger migration and set the repository variable SUPABASE_LEDGER to true.
        if: always() && vars.SUPABASE_LEDGER == 'true'
        run: uv run nhl live supabase --r2
      - name: Real bets, entries and settlements
        # ADR 0039 and #268: first the Kalshi orders that expired since the last slot, the late
        # games' among them, have their fills recorded and, on the live exchange, the bet's entry
        # written (ADR 0040, #281; counts only in the log, the fills to the owner's Telegram).
        # Then the owner's entries from the dashboard copied once each to R2, the record (once the
        # real bets migration is applied and SUPABASE_REAL is true), with the automatic Kalshi
        # bets' entries sent to the dashboard (#287; needs the Kalshi migration), then a
        # settlement appended for each placed bet whose game is final, on the full game, and
        # copied to the dashboard's real record (#270; needs the real settlements migration). A
        # postponed Kalshi game settles on its result within two weeks, and is held after.
        if: always()
        env:
          SUPABASE_REAL: ${{ vars.SUPABASE_REAL }}
          KALSHI_TRADING: ${{ vars.KALSHI_TRADING || 'off' }}
          KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$SUPABASE_REAL" = "true" ]; then sb=(--supabase); else sb=(); fi
          # A failed orders run fails the step after sync and settle, which don't need it. Then
          # the record is checked against Kalshi's own settlements (#287; the differences go to
          # the owner's Telegram, the log has counts only), and the fills are valued against the
          # Pinnacle reference observed after them (#318; the figures privately to R2, the log
          # has counts only).
          status=0
          uv run nhl real orders --r2 || status=1
          uv run nhl real sync --r2 "${sb[@]}"
          uv run nhl real settle --r2 "${sb[@]}"
          uv run nhl real reconcile-kalshi --r2 || status=1
          uv run nhl real fills --r2 || status=1
          exit $status
      - name: Pre-game goalies into the lake
        # Pre-game goalie polls, NHL and Daily Faceoff (#42, #48), rebuilt from the raw copies:
        # today, which the evening slots poll ahead, and the three game dates before it, so two
        # missed nights are caught up.
        if: always()
        run: uv run nhl goalies replay --recent 4 --r2
      - name: Live feature rows for today's slate
        # Today's slate (US Eastern date) and its games' feature rows (#162, docs/plans/phase-5.md
        # task 1): the lake's tables pulled from R2, the season's played-game tables brought up
        # to date with the night's games, the target rows written beside them, and the build
        # recorded in feature_builds. It refuses while a game of the week before is not final in
        # the lake, so a missing game never drops out of its teams' histories unnoticed.
        if: always()
        run: uv run nhl live features --date "$(TZ=America/New_York date +%F)" --r2
      - name: Live report to Supabase
        # The live report as of today for the dashboard (#168), with its intervals, interim until
        # the formal review, after the feature rows so it never holds them up. The weekly committed
        # copy under reports/live/ stays the record. Only from a night whose results, closing
        # proxies and settlements all came in, and never from a dispatch over an earlier window
        # (start set), which ingests other nights: a report from stale inputs would stay in the
        # dashboard's CLV history under today's date.
        if: >-
          always() && vars.SUPABASE_LEDGER == 'true' && !inputs.start &&
          steps.ingest.outcome == 'success' && steps.odds.outcome == 'success' &&
          steps.settle.outcome == 'success'
        run: uv run nhl live report --r2 --supabase --out data/live/reports
      - name: Run bundles complete
        # Every decision day's run bundle has its manifest (#188). One left unfinished by a run
        # that stopped after its ledger is named here, and nhl live bundle --finish completes it.
        if: always()
        run: uv run nhl live bundle --check --r2
      - name: Challengers
        # Each registered challenger's probabilities on every complete run bundle of a day after
        # its registration, written once (#255, ADR 0038). Never part of a decision. The live
        # report above reads what is stored, so a day's challengers show a night later.
        if: always()
        run: uv run nhl live challengers --r2
      - name: Morning view check (#357)
        # Every stored morning view (ADR 0052) rebuilt into the lake's morning_predictions, and
        # the latest three replayed from their run bundles: a stored day its bundle no longer
        # reproduces fails the step. Never part of a decision; the log prints counts only.
        if: always()
        run: uv run nhl live morning --check --r2
      - name: Kalshi price shadow (#320)
        # Shadow kalshi_prices (ADR 0046) on each game date since its registration, before today,
        # not kept yet: two fair values, the market's and conservative_blend's, selecting on
        # Kalshi's own prices from the watch's logs (#319), with one taker and maker execution and
        # one notional budget each. Paper only. Its days and figures go privately to R2 (#280);
        # the log prints counts only.
        if: always()
        run: uv run nhl real shadow --r2
      - name: Contract test on a golden game
        # One golden game read live must parse as its frozen copy does (issue #6). A failure
        # means the NHL API changed under the parsers.
        if: always()
        env:
          NHL_CONTRACT: "1"
        run: uv run pytest tests/contract -q
      - name: R2 bucket size
        if: always()
        run: uv run nhl lake size --max-gb 8

name: ingest-nightly
# The last three NHL game dates into the lake and Supabase (docs/data-sources.md, issue #4): the
# schedule, play-by-play, boxscores, shift charts, rosters and new players' landing pages, every
# raw response mirrored to R2. The lookback picks up a game that was not final yet and a missed
# night; responses already in R2 are reused, not fetched again. The Supabase read at the end of
# every run keeps the free project from pausing in the off-season. Older gaps are caught up with
# a manual run over a date range. The Cloudflare Worker in infra/timer dispatches it at 09:00 UTC
# (#50); the cron line is the fallback while the timer is off.
on:
  schedule:
    - cron: "0 9 * * *"  # 04:00 or 05:00 ET, after every game of the night is final
  workflow_dispatch:
    inputs:
      start:
        description: First game date (YYYY-MM-DD); empty for yesterday
        required: false
        default: ""
      end:
        description: Last game date (YYYY-MM-DD); empty for the start date
        required: false
        default: ""
concurrency: ingest
permissions:
  contents: read
jobs:
  ingest:
    # GitHub's schedule is the fallback: once the Cloudflare timer in infra/timer runs (#50), the
    # repository variable TIMER_ACTIVE is true and only its on-time dispatches start this job.
    if: github.event_name != 'schedule' || vars.TIMER_ACTIVE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Ingest
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          if [ -n "$START" ]; then window=(--start "$START" --end "${END:-$START}"); else window=(--recent 3); fi
          uv run nhl ingest "${window[@]}" --r2 --supabase
      - name: Recheck last week's feeds
        # Each final game's play-by-play, boxscore and shift chart fetched again a week after the
        # copy the tables read, and stored apart where no table reads them, to measure post-game
        # corrections (#30, ADR 0004). Three dates, so two missed nights are caught up.
        if: always()
        run: uv run nhl recheck --recent 3 --r2
      - name: Odds history into the lake
        # The last 14 days of stored odds snapshots, each event matched to its NHL game (issue
        # #20). Events are priced up to about ten days ahead and a schedule response lists seven
        # days, so a snapshot is replayed until the schedules cached since list all its games.
        # Each started game's closing proxy is marked, and the flag upserted to Supabase (#21).
        if: always()
        run: uv run nhl odds replay --recent 14 --r2 --supabase
      - name: Settle the paper bets
        # Each paper bet whose game is final: its result on the full game, its profit, and its
        # CLV against Pinnacle's closing proxy, in the odds the replay above has just updated (#165).
        if: always()
        run: uv run nhl live settle --r2
      - name: Paper ledger to Supabase
        # The day's settlements onto the dashboard's paper bets (#167), once the owner has applied
        # the paper ledger migration and set the repository variable SUPABASE_LEDGER to true.
        if: always() && vars.SUPABASE_LEDGER == 'true'
        run: uv run nhl live supabase --r2
      - name: Pre-game goalies into the lake
        # Pre-game goalie polls, NHL and Daily Faceoff (#42, #48), rebuilt from the raw copies:
        # today, which the evening slots poll ahead, and the three game dates before it, so two
        # missed nights are caught up.
        if: always()
        run: uv run nhl goalies replay --recent 4 --r2
      - name: Live feature rows for today's slate
        # Today's slate (US Eastern date) and its games' feature rows (#162, docs/plans/phase-5.md
        # task 1): the lake's tables pulled from R2, the season's played-game tables brought up
        # to date with the night's games, the target rows written beside them, and the build
        # recorded in feature_builds. It refuses while a game of the week before is not final in
        # the lake, so a missing game never drops out of its teams' histories unnoticed.
        if: always()
        run: uv run nhl live features --date "$(TZ=America/New_York date +%F)" --r2
      - name: Contract test on a golden game
        # One golden game read live must parse as its frozen copy does (issue #6). A failure
        # means the NHL API changed under the parsers.
        if: always()
        env:
          NHL_CONTRACT: "1"
        run: uv run pytest tests/contract -q
      - name: R2 bucket size
        if: always()
        run: uv run nhl lake size --max-gb 8

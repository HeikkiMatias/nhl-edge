name: ingest-nightly
# Yesterday's NHL games into the lake and Supabase (docs/data-sources.md, issue #4): the week's
# schedule, play-by-play, boxscores, shift charts, rosters and new players' landing pages, every
# raw response mirrored to R2. The Supabase read at the end of every run keeps the free project
# from pausing in the off-season. A missed night is caught up with a manual run over a date range.
on:
  schedule:
    - cron: "0 9 * * *"  # 04:00 or 05:00 ET, after every game of the night is final
  workflow_dispatch:
    inputs:
      start:
        description: First game date (YYYY-MM-DD); empty for yesterday
        required: false
        default: ""
      end:
        description: Last game date (YYYY-MM-DD); empty for the start date
        required: false
        default: ""
concurrency: ingest
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Ingest
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          if [ -n "$START" ]; then window=(--start "$START" --end "${END:-$START}"); else window=(--yesterday); fi
          uv run nhl ingest "${window[@]}" --r2 --supabase
      - name: R2 bucket size
        if: always()
        run: uv run nhl lake size --max-gb 8

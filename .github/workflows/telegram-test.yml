name: Telegram test

# A manual check of the real bets setup (#268, #270). The logs are public, so it prints only
# whether each dashboard table answers, never a key, address or row.
on:
  workflow_dispatch:
  push:
    branches: [phase-6/telegram-test]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the dashboard's real tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          auth=(-H "apikey: $SUPABASE_KEY")
          case "$SUPABASE_KEY" in eyJ*) auth+=(-H "Authorization: Bearer $SUPABASE_KEY");; esac
          report=""
          missing=0
          for table in real_alerts real_entries real_settlements real_corrections real_days; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" \
              "$SUPABASE_URL/rest/v1/$table?select=game_date&limit=1")
            if [ "$code" = "200" ]; then report="$report $table: ok;"; else report="$report $table: HTTP $code;"; missing=1; fi
          done
          echo "::notice::$report"
          exit $missing

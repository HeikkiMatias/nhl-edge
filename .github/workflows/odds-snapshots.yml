name: odds-snapshots
# Live Odds API snapshots into Supabase odds_snapshots (docs/data-sources.md, issue #3).
# The Cloudflare Worker in infra/timer dispatches it at each slot, set in US Eastern time, with the
# slot as input (issue #50): GitHub's own schedule started runs 3 to 6 hours late.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Slot whose markets to pull
        type: choice
        options: [morning, midday, pre7, pre8, pre10]
        default: morning
      skip_if_no_games:
        description: Skip the Odds API call when the slot has no NHL games
        type: boolean
        default: true
concurrency: odds
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Pre-game goalies
        # The pre-game boxscore, landing and right-rail of every game in the next 18 hours, and
        # Daily Faceoff's starting goalies for their dates, stored raw in R2 (issues #42 and #48),
        # so the goalie state is on record at each odds slot. It runs before the snapshot, so every
        # goalie row is observed before the prices of the same slot and a point-in-time join can
        # use it.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run nhl goalies poll --mirror-raw
      - name: Snapshot
        # Runs when the goalie poll failed too.
        if: always()
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SLOT: ${{ inputs.slot }}
          SKIP: ${{ inputs.skip_if_no_games }}
        run: |
          if [ "$SKIP" = "true" ]; then skip=--skip-if-no-games; else skip=--no-skip-if-no-games; fi
          uv run nhl odds snapshot --regions eu --slot-plan free-tier "$skip" --mirror-raw --slot "$SLOT"

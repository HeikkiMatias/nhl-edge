name: odds-snapshots
# Live Odds API snapshots into Supabase odds_snapshots (docs/data-sources.md, issue #3).
# Slots are set in US Eastern time. Each slot has one cron line per UTC offset, and the CLI maps
# the line that fired to a slot for today's offset, skipping the other half of the year, so no
# edit is needed when DST starts or ends.
on:
  schedule:
    - cron: "5 11 * * *"    # morning, EDT
    - cron: "5 12 * * *"    # morning, EST
    - cron: "45 16 * * *"   # midday, EDT
    - cron: "45 17 * * *"   # midday, EST
    - cron: "45 22 * * *"   # pre7, EDT
    - cron: "45 23 * * *"   # pre8 in EDT, pre7 in EST
    - cron: "45 0 * * *"    # pre8, EST
    - cron: "45 1 * * *"    # pre10, EDT
    - cron: "45 2 * * *"    # pre10, EST
  workflow_dispatch:
    inputs:
      slot:
        description: Slot whose markets to pull
        type: choice
        options: [morning, midday, pre7, pre8, pre10]
        default: morning
      skip_if_no_games:
        description: Skip the Odds API call when the slot has no NHL games
        type: boolean
        default: true
concurrency: odds
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Pre-game goalies
        # The pre-game boxscore, landing and right-rail of every game in the next 18 hours, stored
        # raw in R2 (issue #42), so the goalie state is on record at each odds slot. It runs before
        # the snapshot, so every goalie row is observed before the prices of the same slot and a
        # point-in-time join can use it. The odds cron lines of the other half of the DST year skip.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then pick=(--cron "$CRON"); else pick=(); fi
          uv run nhl goalies poll --mirror-raw "${pick[@]}"
      - name: Snapshot
        # Runs when the goalie poll failed too.
        if: always()
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CRON: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
          SKIP: ${{ github.event_name == 'schedule' || inputs.skip_if_no_games }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then pick=(--cron "$CRON"); else pick=(--slot "$SLOT"); fi
          if [ "$SKIP" = "true" ]; then skip=--skip-if-no-games; else skip=--no-skip-if-no-games; fi
          uv run nhl odds snapshot --regions eu --slot-plan free-tier "$skip" --mirror-raw "${pick[@]}"

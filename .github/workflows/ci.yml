name: ci
# Each change runs once: on its pull request, and on main after the merge. A push to a branch
# with an open pull request no longer runs a second copy, and a newer push to the same pull
# request cancels the older run (#213: the repository is private, so every minute is billed).
# The dashboard has its own workflow (web.yml), and no Python test reads web/.
on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
# Read-only: these run on pull requests and on main, and write nothing (#294).
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pyright src
      # The leakage tests run once, as their own step.
      - run: uv run pytest -m "not slow" -q --ignore=tests/leakage
      - run: uv run pytest tests/leakage -q
      - name: Timer Worker tests
        run: node --test
        working-directory: infra/timer

name: kalshi-watch
# Every game's Kalshi markets watched from the evening before to the start (#319), for choosing
# the owner's own orders (the owner's decisions of 2026-10-23 and 2026-10-30): each winner market's
# top of book every minute and its full book and trades every 5 minutes within 12 hours of the
# start (every 15 and 30 minutes before), and the listings of every game market, the totals and
# spreads near the start and the player props, stored raw in R2 and rebuilt into the lake's private
# kalshi_tops, kalshi_depth, kalshi_trades and kalshi_lines. The Cloudflare timer in infra/timer
# dispatches it every 4 hours, at 03:05, 07:05, 11:05, 15:05, 19:05 and 23:05 US Eastern, since
# GitHub's schedule started runs hours late (#50); each run stops a minute before the next window,
# inside GitHub's 6-hour job limit, and a day without games ends at once. Kalshi's Developer Agreement limits its
# API to a member's own trading (3.1): the data stays in R2, and the job prints counts only, since
# run logs are public. The watch is public REST only: no Kalshi key is read. The quote job beside it
# places the owner's own demo orders (#375), with the demo key.
on:
  schedule:
    # The fallback while the timer is off, one line per UTC offset: the CLI skips the other half
    # of the year's line (ingest/kalshi_watch.FALLBACK_CRONS), and a late run only watches until
    # the next window.
    - cron: "5 3,7,11,15,19,23 * * *"   # EDT
    - cron: "5 0,4,8,12,16,20 * * *"    # EST
  workflow_dispatch:
concurrency:
  group: kalshi-watch
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  watch:
    # GitHub's schedule is the fallback: once the Cloudflare timer runs (#50), the repository
    # variable TIMER_ACTIVE is true and only its on-time dispatches start this job.
    if: github.event_name != 'schedule' || vars.TIMER_ACTIVE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --frozen
      - name: Kalshi watch (#319)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then pick=(--cron "$CRON"); else pick=(); fi
          uv run nhl kalshi watch --mirror-raw "${pick[@]}"
  quote:
    # Two-sided quoting on Kalshi's demo exchange (#375, ADR 0055), mock funds only: the paper
    # simulator's rules at the model's fair value, a step each minute from the morning view's
    # publication to each game's start less 10 minutes, ending with this window like the watch.
    # GitHub's runners for now, the owner's choice: a location refusal (#347) is recorded, and
    # every bid expires 10 minutes before its start on Kalshi's side. It runs only while the
    # repository variable KALSHI_TRADING is demo, with the demo key; the log prints counts only.
    if: (github.event_name != 'schedule' || vars.TIMER_ACTIVE != 'true') && vars.KALSHI_TRADING == 'demo'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --frozen
      - name: Demo quotes (#375)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KALSHI_TRADING: ${{ vars.KALSHI_TRADING }}
          KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run nhl real quote --r2

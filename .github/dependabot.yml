version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The dashboard's packages (#316): a critical advisory in next 16.4.0 went unflagged (#314).
  # Minor and patch updates arrive as one PR, so next, react and the @types packages move together;
  # package.json keeps its exact pins, which Dependabot raises in place.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      dashboard:
        update-types: ["minor", "patch"]
    # @types/node follows the Node the dashboard runs on (22: web.yml and engines), not Node's
    # latest, so its types never accept an API the runtime lacks (#335). Its minor and patch
    # updates still come with the group; a later Node moves web.yml, engines and it together.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

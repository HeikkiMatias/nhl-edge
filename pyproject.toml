[project]
name = "nhl-edge"
version = "0.1.0"
description = "NHL moneyline model that must add information beyond a recalibrated market"
authors = [{ name = "Heikki Mattila" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.103",
    "duckdb>=1.1",
    "httpx>=0.28.1",
    "pandera[polars]>=0.20",
    "polars>=1.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.scripts]
nhl = "nhl_edge.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright[nodejs]>=1.1.380",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests/unit"]  # shared test helpers, as pytest's pythonpath
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit"]  # shared test doubles in tests/unit/fakes.py
addopts = "--strict-markers --import-mode=importlib"
markers = ["slow: long-running tests, excluded from the fast suite with -m 'not slow'"]

# Local hooks run the lockfile's tool versions, the same as CI and the Claude Code hooks.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright src
        language: system
        types_or: [python, pyi]
        pass_filenames: false
